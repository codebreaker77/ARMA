[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arma-veto"
version = "0.1.0"
description = "Sub-50ms deterministic test-tampering and evasion linter for AI coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ARMA Contributors"}
]
keywords = [
    "ai-agents",
    "swe-bench",
    "code-generation",
    "testing",
    "linter",
    "pre-commit",
    "ast",
    "reward-hacking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codebreaker77/ARMA"
Repository = "https://github.com/codebreaker77/ARMA.git"
Issues = "https://github.com/codebreaker77/ARMA/issues"

[project.scripts]
arma-veto = "arma_veto.interrogator:main_cli"

[tool.setuptools.packages.find]
include = ["arma_veto*"]
exclude = ["experiments*", "tests*", "data*", "layer*", "docs*"]
